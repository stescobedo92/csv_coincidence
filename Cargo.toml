[package]
name = "csv_coincidence"
version = "0.3.0"
edition = "2021"
authors = ["Sergio Triana Escobedo <stescobedo.31@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "Search, count, filter, replace, and report pattern matches inside CSV files"
homepage = "https://github.com/stescobedo92/csv_coincidence"
repository = "https://github.com/stescobedo92/csv_coincidence"
readme = "README.md"
keywords = ["csv", "regex", "search", "cli", "data"]
categories = ["command-line-utilities", "text-processing", "parsing"]
exclude = [".github/*"]

[[bin]]
name = "csv-coincidence"
path = "src/bin/csv_coincidence.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
csv = "1.3"
regex = "1.10"
strsim = "0.11"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"], optional = true }

[dev-dependencies]
tempfile = "3"
